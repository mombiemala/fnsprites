name: Sprite updates scout

# Scheduled research aid: pulls public Fortnite sources (fortnite-api.com, a Fortnite
# datamine repo's commit feed, fortnite.com/news, fortnite.gg), surfaces anything that looks like a new Sprite,
# Lobby Hack code or Sprite event, and opens a REVIEW PULL REQUEST with
# docs/sprite-updates-draft.md. It NEVER edits the live site — a human reviews the
# draft and folds real updates into src/data/{codes,sprites,news}.js. No API key,
# no auth, no cost. See scripts/fetch-sprite-updates.mjs.
#
# NOTE: GitHub `schedule:` only fires from the repository's DEFAULT branch, so this
# is effective on mombiemala/fnsprites (default `main`). It rides along harmlessly
# on other branches (just won't be scheduled there).

on:
  schedule:
    - cron: '40 14 * * 1,4,6' # Mon/Thu/Sat at 14:40 UTC (~10:40 AM ET) — Fortnite's event days
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sprite-updates-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the draft
        env:
          GITHUB_TOKEN: ${{ github.token }} # keyless: raises the GitHub API rate limit for the datamine-repo commit reads
        run: node scripts/fetch-sprite-updates.mjs

      - name: Open or refresh the review PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -A docs/sprite-updates-draft.md
          if git diff --cached --quiet; then
            echo "Draft unchanged — no PR needed. (Correct when there's no news.)"
            exit 0
          fi
          BRANCH=bot/sprite-updates
          git config user.name "sprite-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(news): refresh sprite/codes/events draft"
          git push -f origin "$BRANCH"
          open_count="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$open_count" != "0" ]; then
            echo "Draft PR already open — force-pushed the refresh onto it."
            exit 0
          fi
          printf '%s\n' \
            "Automated sweep of public Fortnite sources (fortnite-api.com, fortnite.com/news, fortnite.gg) for new Sprites, Lobby Hack codes and events. See \`docs/sprite-updates-draft.md\`." \
            "" \
            "**This does not touch the live site.** Review the candidates, confirm them, then fold anything real into \`src/data/codes.js\`, \`src/data/sprites.js\` and \`src/data/news.js\` (+ changelog). Epic's Instagram-only reveals still need a human." \
            "" \
            "This branch is reused each run; close the PR to dismiss a batch." \
            > /tmp/pr-body.md
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Sprite/codes/events draft — review & fold in" \
            --body-file /tmp/pr-body.md
